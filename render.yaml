services:
  - type: web
    name: whizy-ai-2
    runtime: python
    plan: free
    buildCommand: "python --version"
    startCommand: "python server.py"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: IMAGE_MODEL
        value: gpt-image-1
      - key: TAVILY_API_KEY
        sync: false
      - key: WHIZY_REQUESTS_PER_MINUTE
        value: "20"
